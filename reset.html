<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09121d">
  <title>Atualizando Calculadora</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07101a;color:#fff;font-family:system-ui;padding:24px;text-align:center}.card{max-width:460px;background:#101d2b;border:1px solid #26384a;border-radius:24px;padding:28px}h1{font-size:25px}p{color:#9caabc;line-height:1.5}.spin{width:46px;height:46px;border:4px solid #26384a;border-top-color:#ff9718;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="card"><div class="spin"></div><h1>Atualizando a calculadora</h1><p>O cache antigo está sendo removido. Você será redirecionado automaticamente.</p></div>
  <script>
    (async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}catch(e){}setTimeout(()=>location.replace('./index.html?v='+Date.now()),900)})();
  </script>
</body>
</html>
